# Busca UNA vez las portadas (Open Library / Google Books) y las fotos de bandas (oEmbed
# público de Spotify, sin API key) y las guarda en app/. Así el Space de Hugging Face no
# las vuelve a buscar en cada reinicio (su disco se borra al reiniciar).
# Solo busca las que faltan: las que ya están en los CSV se respetan (incluidas las manuales).
name: Precalcular imágenes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/bandas_completo.csv
      - app/libros_con_sinopsis.csv
      - scripts/build_chat_app.py
      - .github/workflows/imagenes.yml

permissions:
  contents: write

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: "Instalar dependencias (sin torch, aquí no se calculan embeddings)"
        run: pip install gradio==6.28.0 pandas numpy requests openai scikit-learn

      - name: Buscar portadas y fotos que falten
        working-directory: app
        run: python -c "import app"

      - name: Resumen
        working-directory: app
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          p = pd.read_csv("portadas_libros.csv").fillna("")
          f = pd.read_csv("fotos_bandas.csv").fillna("")
          print(f"- Portadas: {len(p)} libros en el CSV")
          print(f"- Fotos de bandas: {(f['foto_url'] != '').sum()} de {len(f)}")
          PY

      - name: Commit si hubo cambios
        run: |
          rm -f app/sugerencias_usuarios.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/portadas_libros.csv app/fotos_bandas.csv
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Precalcular portadas de libros y fotos de bandas"
          git push
